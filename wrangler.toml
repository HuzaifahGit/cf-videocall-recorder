# One Worker: the call page (public/), the room API and the room itself (a Durable Object per room name).
# Secrets (wrangler secret put NAME): RT_APP_ID, RT_APP_SECRET, ROOM_KEY; for recording also REC_KEY.
name = "cf-videocall-recorder"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/rec/*"]

[vars]
RECORD = "off" # "on" records audio and shared screens to R2 while 2+ people are in a room (see README: consent)

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"] # SQLite-backed Durable Objects: available on the Workers free plan

# Recording only: uncomment, and create the bucket first (wrangler r2 bucket create videocall-recordings)
# [[r2_buckets]]
# binding = "DATA"
# bucket_name = "videocall-recordings"
